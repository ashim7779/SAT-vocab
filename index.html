<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAT Word Roots & Affixes Master Suite</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --correct: #16a34a;
      --correct-glow: rgba(22, 163, 74, 0.4);
      --wrong: #dc2626;
      --wrong-glow: rgba(220, 38, 38, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }

    .app-container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      background: var(--bg-card);
      padding: 0.4rem;
      border-radius: 1rem;
      border: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      padding: 0.65rem 0.85rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      padding: 0.65rem 1rem;
      border-radius: 0.85rem;
      border: 1px solid var(--border-color);
    }

    .select-input, .search-input {
      background: #0f172a;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      outline: none;
      max-width: 100%;
    }

    .stat-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: #0f172a;
      padding: 0.3rem 0.7rem;
      border-radius: 2rem;
      border: 1px solid var(--border-color);
      font-weight: 700;
      font-size: 0.85rem;
    }
    .mode-view {
      display: none;
      width: 100%;
    }

    .mode-view.active {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .quiz-card {
      background: var(--bg-card);
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      position: relative;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .type-badge {
      text-transform: uppercase;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.65rem;
      border-radius: 1rem;
      background: #312e81;
      color: #a5b4fc;
    }

    .progress-badge {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #a5b4fc;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 0.25rem 0.75rem;
      border-radius: 1rem;
    }

    .quiz-term {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      margin: 0.2rem 0;
    }

    .quiz-card.shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
    }

    .option-btn {
      background: #0f172a;
      color: var(--text-main);
      border: 2px solid var(--border-color);
      padding: 0.65rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.92rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: #1e1b4b;
    }

    .option-btn.wrong-choice {
      background: var(--wrong) !important;
      border-color: var(--wrong) !important;
      color: #ffffff !important;
      box-shadow: 0 0 12px var(--wrong-glow);
    }

    .option-btn.correct-choice {
      background: var(--correct) !important;
      border-color: var(--correct) !important;
      color: #ffffff !important;
      box-shadow: 0 0 12px var(--correct-glow);
    }

    .explanation-box {
      display: none;
      background: #0f172a;
      border-left: 4px solid var(--accent);
      padding: 0.6rem 0.85rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 0.75rem;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease;
      width: 100%;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #334155; width: auto; }
    .btn-secondary:hover { background: #475569; }
    .btn-action { background: #059669; width: auto; }
    .btn-action:hover { background: #047857; }

    /* Completion Interface */
    .completion-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
      padding: 1rem 0;
    }

    .completion-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #a5b4fc;
    }

    .completion-stats {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .completion-actions {
      display: flex;
      gap: 0.75rem;
      width: 100%;
    }

    /* Flashcard Styles */
    .flashcard-wrapper {
      perspective: 1000px;
      height: 300px;
      width: 100%;
      cursor: pointer;
    }

    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .flashcard.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }

    .card-back {
      transform: rotateY(180deg);
      border-color: var(--accent);
    }

    .card-term {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .card-meaning {
      font-size: 1.35rem;
      font-weight: 700;
      color: #a5b4fc;
      margin-bottom: 0.8rem;
    }

    .card-examples {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .card-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .session-bar {
      background: var(--bg-card);
      border: 1px dashed var(--accent);
      padding: 0.75rem 1rem;
      border-radius: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .match-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .match-tile {
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      padding: 1rem;
      border-radius: 0.75rem;
      font-weight: 700;
      font-size: 0.9rem;
      text-align: center;
      cursor: pointer;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .match-tile.selected {
      border-color: var(--accent);
      background: #312e81;
    }

    .match-tile.matched {
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .match-tile.incorrect {
      background: var(--wrong);
      border-color: var(--wrong);
    }

    /* List View Styles */
    .search-bar-container { width: 100%; }
    .study-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 0.3rem;
    }

    .list-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 0.85rem 1rem;
      border-radius: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .list-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-term { font-size: 1.1rem; font-weight: 800; color: #ffffff; }
    .list-meaning { font-size: 0.95rem; font-weight: 600; color: #a5b4fc; }
    .list-examples { font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Navigation Modes -->
  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchMode('flashcards')">🃏 Flashcards</button>
    <button class="tab-btn" onclick="switchMode('quiz')">🎯 Practice Quiz</button>
    <button class="tab-btn" onclick="switchMode('match')">🧩 Match Game</button>
    <button class="tab-btn" onclick="switchMode('list')">📖 Word Bank</button>
  </nav>

  <!-- Section Dropdown Selector -->
  <div class="controls-bar">
    <select id="section-select" class="select-input" onchange="applyFilter()">
      <option value="All">All Terms (All 218 Items)</option>

      <optgroup label="Prefixes (62 Terms)">
        <option value="Prefix - All">Prefix - All (62 Terms)</option>
        <option value="Prefix (Pt 1)">Prefix (Pt 1)</option>
        <option value="Prefix (Pt 2)">Prefix (Pt 2)</option>
        <option value="Prefix (Pt 3)">Prefix (Pt 3)</option>
        <option value="Prefix (Pt 4)">Prefix (Pt 4)</option>
      </optgroup>

      <optgroup label="Roots (131 Terms)">
        <option value="Root - All">Root - All (131 Terms)</option>
        <option value="Root (Pt 1)">Root (Pt 1)</option>
        <option value="Root (Pt 2)">Root (Pt 2)</option>
        <option value="Root (Pt 3)">Root (Pt 3)</option>
        <option value="Root (Pt 4)">Root (Pt 4)</option>
        <option value="Root (Pt 5)">Root (Pt 5)</option>
      </optgroup>

      <optgroup label="Suffixes (25 Terms)">
        <option value="Suffix - All">Suffix - All (25 Terms)</option>
        <option value="Suffix (Pt 1)">Suffix (Pt 1)</option>
        <option value="Suffix (Pt 2)">Suffix (Pt 2)</option>
        <option value="Suffix (Pt 3)">Suffix (Pt 3)</option>
        <option value="Suffix (Pt 4)">Suffix (Pt 4)</option>
      </optgroup>
    </select>

    <div id="stats-container"></div>
  </div>

  <!-- MODE 1: Flashcards -->
  <div id="flashcards-view" class="mode-view active">
    <div class="flashcard-wrapper" onclick="flipCard()">
      <div id="flashcard" class="flashcard">
        <div class="card-face card-front">
          <span id="fc-type" class="type-badge" style="position:absolute; top:1.25rem; left:1.25rem;">ROOT</span>
          <div id="fc-term" class="card-term">--</div>
          <p style="color: var(--text-muted); font-size: 0.8rem;">Click or press Space to flip</p>
        </div>
        <div class="card-face card-back">
          <div id="fc-meaning" class="card-meaning">--</div>
          <div id="fc-examples" class="card-examples">--</div>
        </div>
      </div>
    </div>
    <div class="card-controls">
      <button class="btn btn-secondary" onclick="prevCard()">← Prev</button>
      <span id="fc-counter" style="font-weight: 700; color: var(--text-muted);">1 / 218</span>
      <button class="btn btn-secondary" onclick="shuffleCards()">🔀 Shuffle</button>
      <button class="btn btn-secondary" onclick="nextCard()">Next →</button>
    </div>
  </div>

  <!-- MODE 2: Quiz -->
  <div id="quiz-view" class="mode-view">
    <div id="quiz-card" class="quiz-card">
      <!-- Active Question Content -->
      <div id="qz-main-content">
        <div class="quiz-header">
          <span id="qz-type" class="type-badge">PREFIX</span>
          <span id="qz-progress-counter" class="progress-badge">0 / 0</span>
        </div>

        <div id="qz-term" class="quiz-term">--</div>

        <div id="qz-options" class="options-grid"></div>

        <div id="qz-explanation" class="explanation-box">
          <strong>Examples:</strong> <span id="qz-examples-text">--</span>
        </div>

        <button id="qz-next-btn" class="btn" style="display:none; margin-top:0.75rem;" onclick="loadNextQuestion()">Next Question →</button>
      </div>

      <!-- Completion Screen -->
      <div id="qz-completion-screen" class="completion-container" style="display:none;">
        <h2 class="completion-title">🎉 Section Completed!</h2>
        <p id="qz-completion-stats" class="completion-stats">You have completed all questions in this section.</p>
        <div class="completion-actions">
          <button class="btn" onclick="restartCurrentQuiz()">🔄 Re-practice Section</button>
          <button class="btn btn-secondary" style="flex:1;" onclick="goHomeQuiz()">🏠 Go Back to Home</button>
        </div>
      </div>
    </div>

    <!-- Practice Session Bar -->
    <div class="session-bar">
      <div>
        <strong style="font-size:0.85rem;">Session Progress:</strong>
        <p id="session-count-text" style="font-size:0.8rem; color:var(--text-muted);">0 items practiced in this run</p>
      </div>
      <button class="btn btn-action" onclick="practiceSessionFlashcards()">🃏 Practice Session Flashcards</button>
    </div>
  </div>

  <!-- MODE 3: Match Game -->
  <div id="match-view" class="mode-view">
    <div style="display:flex; justify-style:space-between; align-items:center;">
      <span style="font-weight:700; color:var(--text-muted); font-size:0.9rem;">Match terms to their meanings!</span>
      <button class="btn btn-secondary" onclick="startMatchGame()">🔄 Restart</button>
    </div>
    <div id="match-grid" class="match-grid"></div>
  </div>

  <!-- MODE 4: Study List -->
  <div id="list-view" class="mode-view">
    <div class="search-bar-container">
      <input type="text" id="search-input" class="search-input" placeholder="Search prefix, root, suffix, or definition..." oninput="renderStudyList()">
    </div>
    <div id="study-list" class="study-list"></div>
  </div>
</div>

    { term: "-cide", type: "Suffix", meaning: "Act of killing / destroying", examples: "Pesticide, regicide, genocidal" },
    { term: "-cracy / -crat", type: "Suffix", meaning: "Rule", examples: "Democracy, democrat, theocracy, bureaucracy" },
    { term: "-en", type: "Suffix", meaning: "To cause to be, make", examples: "Embolden, heighten, deepen" },
    { term: "-fer", type: "Suffix", meaning: "Carry, bring", examples: "Transfer, ferry, conifer, confer" },
    { term: "-ful", type: "Suffix", meaning: "Full of", examples: "joyful: full of joy, hopeful: full of hope, careful: full of care" },
    { term: "-ian", type: "Suffix", meaning: "Related to", examples: "Librarian, historian, pedestrian" },
    { term: "-ic / -ical", type: "Suffix", meaning: "Characteristic of", examples: "Laconic, pedantic, stoic, pragmatic" },
    { term: "-ify / -efy", type: "Suffix", meaning: "To make into, bring about", examples: "Vilify, exemplify, stupefy" },
    { term: "-ism", type: "Suffix", meaning: "System, belief, doctrine", examples: "Altruism, hedonism, dogmatism" },
    { term: "-ist", type: "Suffix", meaning: "One who practices or adheres to", examples: "Misanthrope, hedonist, protagonist" },
    { term: "-ity / -ty", type: "Suffix", meaning: "Quality, state, or condition", examples: "Animosity, veracity, equanimity, paucity" },
    { term: "-ive", type: "Suffix", meaning: "Performing or tending toward", examples: "Subversive, vindictive, pensive" },
    { term: "-ize", type: "Suffix", meaning: "To cause to conform to, treat as", examples: "Scrutinize, galvanize, ostracize" },
    { term: "-less", type: "Suffix", meaning: "Without, lacking", examples: "Relentless, feckless, reckless, hopeless, careless" },
    { term: "-logy / -ology", type: "Suffix", meaning: "Study of, speech", examples: "Eulogy, tautology, biology, geology, psychology" },
    { term: "-or / -er", type: "Suffix", meaning: "One who performs an action", examples: "Benefactor, precursor, aggressor" },
    { term: "-osis", type: "Suffix", meaning: "condition; state; action; disease", examples: "dermatosis: skin disease, fibrosis: excess fibrous tissue, halitosis: bad breath, hypnosis: induced trance, mitosis: cell division, narcosis: stupor, osmosis: fluid diffusion, psychosis: mental disorder, scoliosis: spine curvature, toxicosis: illness from poisoning" },
    { term: "-tion / -sion", type: "Suffix", meaning: "State, act, result", examples: "Coercion, circumvention, depredation" },
    { term: "-ude", type: "Suffix", meaning: "State, quality, condition", examples: "Fortitude, latitude, solitude, magnitude" }
  ];

  // Application State
  let currentMode = "flashcards";
  let activeData = [...masterData];
  let quizDeck = [];
  let sessionStudied = [];
  let fcIndex = 0;
  let qzCompletedCount = 0;
  let qzCurrent = null;
  let qzScore = 0;
  let qzStreak = 0;

  function applyFilter() {
    const val = document.getElementById("section-select").value;

    if (val === "All") {
      activeData = [...masterData];
    } else if (val.startsWith("Prefix")) {
      const prefixes = masterData.filter(i => i.type === "Prefix");
      if (val === "Prefix - All") {
        activeData = prefixes;
      } else {
        const pt = parseInt(val.replace("Prefix (Pt ", "").replace(")", ""), 10);
        const chunkSize = Math.ceil(prefixes.length / 4);
        activeData = prefixes.slice((pt - 1) * chunkSize, pt * chunkSize);
      }
    } else if (val.startsWith("Root")) {
      const roots = masterData.filter(i => i.type === "Root");
      if (val === "Root - All") {
        activeData = roots;
      } else {
        const pt = parseInt(val.replace("Root (Pt ", "").replace(")", ""), 10);
        const chunkSize = Math.ceil(roots.length / 5);
        activeData = roots.slice((pt - 1) * chunkSize, pt * chunkSize);
      }
    } else if (val.startsWith("Suffix")) {
      const suffixes = masterData.filter(i => i.type === "Suffix");
      if (val === "Suffix - All") {
        activeData = suffixes;
      } else {
        const pt = parseInt(val.replace("Suffix (Pt ", "").replace(")", ""), 10);
        const chunkSize = Math.ceil(suffixes.length / 4);
        activeData = suffixes.slice((pt - 1) * chunkSize, pt * chunkSize);
      }
    }

    fcIndex = 0;
    resetQuizDeck();
    renderCurrentMode();
  }

  function resetQuizDeck() {
    quizDeck = [...activeData].sort(() => Math.random() - 0.5);
    qzCompletedCount = 0;
  }

  function restartCurrentQuiz() {
    resetQuizDeck();
    loadQuizQuestion();
  }

  function goHomeQuiz() {
    document.getElementById("section-select").value = "All";
    applyFilter();
    switchMode('flashcards');
  }

  function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
    document.querySelectorAll(".mode-view").forEach(view => view.classList.remove("active"));

    const tabBtns = document.querySelectorAll(".tab-btn");
    if (mode === 'flashcards') tabBtns[0].classList.add("active");
    if (mode === 'quiz') tabBtns[1].classList.add("active");
    if (mode === 'match') tabBtns[2].classList.add("active");
    if (mode === 'list') tabBtns[3].classList.add("active");

    document.getElementById(`${mode}-view`).classList.add("active");
    renderCurrentMode();
  }

  function renderCurrentMode() {
    updateStatsBar();
    if (currentMode === "flashcards") renderFlashcard();
    else if (currentMode === "quiz") loadQuizQuestion();
    else if (currentMode === "match") startMatchGame();
    else if (currentMode === "list") renderStudyList();
  }

  function updateStatsBar() {
    const statsContainer = document.getElementById("stats-container");
    if (currentMode === "quiz") {
      statsContainer.innerHTML = `<span class="stat-badge">🔥 ${qzStreak}</span> <span class="stat-badge">🎯 ${qzScore}</span>`;
    } else {
      statsContainer.innerHTML = `<span class="stat-badge">📚 ${activeData.length} Terms</span>`;
    }
  }

  function trackSessionItem(item) {
    if (!sessionStudied.some(i => i.term === item.term)) {
      sessionStudied.push(item);
    }
    document.getElementById("session-count-text").textContent = `${sessionStudied.length} items practiced in this run`;
  }

  /* FLASHCARDS LOGIC */
  function renderFlashcard() {
    if (activeData.length === 0) return;
    const card = activeData[fcIndex];
    document.getElementById("flashcard").classList.remove("flipped");
    document.getElementById("fc-type").textContent = card.type;
    document.getElementById("fc-term").textContent = card.term;
    document.getElementById("fc-meaning").textContent = card.meaning;
    document.getElementById("fc-examples").textContent = "Examples: " + card.examples;
    document.getElementById("fc-counter").textContent = `${fcIndex + 1} / ${activeData.length}`;
  }

  function flipCard() {
    document.getElementById("flashcard").classList.toggle("flipped");
  }

  function nextCard() {
    fcIndex = (fcIndex + 1) % activeData.length;
    renderFlashcard();
  }

  function prevCard() {
    fcIndex = (fcIndex - 1 + activeData.length) % activeData.length;
    renderFlashcard();
  }

  function shuffleCards() {
    activeData.sort(() => Math.random() - 0.5);
    fcIndex = 0;
    renderFlashcard();
  }

  /* QUIZ LOGIC WITH COMPLETION INTERFACE & FIXED COUNTER */
  function loadNextQuestion() {
    qzCompletedCount++;
    loadQuizQuestion();
  }

  function loadQuizQuestion() {
    if (activeData.length === 0) return;

    // Check if user completed all questions in the active section deck
    if (quizDeck.length === 0) {
      document.getElementById("qz-main-content").style.display = "none";
      document.getElementById("qz-completion-screen").style.display = "flex";
      document.getElementById("qz-completion-stats").textContent = `Great work! You scored ${qzScore} correct with a best streak of 🔥 ${qzStreak}.`;
      return;
    }

    // Active Question View
    document.getElementById("qz-main-content").style.display = "block";
    document.getElementById("qz-completion-screen").style.display = "none";
    document.getElementById("qz-progress-counter").textContent = `${Math.min(qzCompletedCount, activeData.length)} / ${activeData.length}`;

    const quizCard = document.getElementById("quiz-card");
    quizCard.classList.remove("shake");
    document.getElementById("qz-explanation").style.display = "none";
    document.getElementById("qz-next-btn").style.display = "none";

    const optionsGrid = document.getElementById("qz-options");
    optionsGrid.innerHTML = "";

    qzCurrent = quizDeck.shift();
    trackSessionItem(qzCurrent);

    document.getElementById("qz-type").textContent = qzCurrent.type;
    document.getElementById("qz-term").textContent = qzCurrent.term;
    document.getElementById("qz-examples-text").textContent = qzCurrent.examples;

    const options = [qzCurrent.meaning];
    while (options.length < 4) {
      const rand = masterData[Math.floor(Math.random() * masterData.length)].meaning;
      if (!options.includes(rand)) options.push(rand);
    }
    options.sort(() => Math.random() - 0.5);

    options.forEach(optText => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = optText;
      btn.onclick = () => handleQuizAnswer(btn, optText);
      optionsGrid.appendChild(btn);
    });
  }

  function handleQuizAnswer(selectedBtn, selectedText) {
    const allBtns = document.querySelectorAll("#qz-options .option-btn");
    allBtns.forEach(b => b.disabled = true);

    const isCorrect = selectedText === qzCurrent.meaning;

    if (isCorrect) {
      selectedBtn.classList.add("correct-choice");
      selectedBtn.innerHTML += " <span>✓</span>";
      qzScore++;
      qzStreak++;
    } else {
      document.getElementById("quiz-card").classList.add("shake");
      selectedBtn.classList.add("wrong-choice");
      selectedBtn.innerHTML += " <span>✗</span>";
      qzStreak = 0;

      // Smart Re-queuing: Insert missed item 2 to 5 positions ahead randomly
      const offset = Math.floor(Math.random() * 4) + 2; 
      const insertIndex = Math.min(quizDeck.length, offset);
      quizDeck.splice(insertIndex, 0, qzCurrent);

      allBtns.forEach(btn => {
        if (btn.textContent === qzCurrent.meaning) {
          btn.classList.add("correct-choice");
          btn.innerHTML += " <span>✓</span>";
        }
      });
    }

    updateStatsBar();
    document.getElementById("qz-explanation").style.display = "block";
    document.getElementById("qz-next-btn").style.display = "block";
  }

  function practiceSessionFlashcards() {
    if (sessionStudied.length === 0) {
      alert("Practice a few questions in the quiz first to build your session deck!");
      return;
    }
    activeData = [...sessionStudied];
    fcIndex = 0;
    switchMode('flashcards');
  }

  let matchSelectedTile = null;

  function startMatchGame() {
    matchSelectedTile = null;
    const grid = document.getElementById("match-grid");
    grid.innerHTML = "";

    const sample = [...activeData].sort(() => Math.random() - 0.5).slice(0, 4);
    const tiles = [];

    sample.forEach((item, idx) => {
      trackSessionItem(item);
      tiles.push({ id: idx, text: item.term, type: "term" });
      tiles.push({ id: idx, text: item.meaning, type: "meaning" });
    });

    tiles.sort(() => Math.random() - 0.5);

    tiles.forEach(tile => {
      const div = document.createElement("div");
      div.className = "match-tile";
      div.textContent = tile.text;
      div.onclick = () => handleMatchClick(div, tile);
      grid.appendChild(div);
    });
  }

  function handleMatchClick(element, tile) {
    if (element.classList.contains("matched") || element === matchSelectedTile?.element) return;

    if (!matchSelectedTile) {
      matchSelectedTile = { element, tile };
      element.classList.add("selected");
    } else {
      if (matchSelectedTile.tile.id === tile.id && matchSelectedTile.tile.type !== tile.type) {
        element.classList.add("matched");
        matchSelectedTile.element.classList.add("matched");
        matchSelectedTile = null;
      } else {
        element.classList.add("incorrect");
        matchSelectedTile.element.classList.add("incorrect");
        
        setTimeout(() => {
          element.classList.remove("incorrect", "selected");
          matchSelectedTile.element.classList.remove("incorrect", "selected");
          matchSelectedTile = null;
        }, 500);
      }
    }
  }

  /* STUDY LIST LOGIC */
  function renderStudyList() {
    const listContainer = document.getElementById("study-list");
    const query = document.getElementById("search-input").value.toLowerCase();
    listContainer.innerHTML = "";

    const filtered = activeData.filter(i => 
      i.term.toLowerCase().includes(query) || 
      i.meaning.toLowerCase().includes(query) || 
      i.examples.toLowerCase().includes(query)
    );

    filtered.forEach(item => {
      const div = document.className = "list-item";
      const divElement = document.createElement("div");
      divElement.className = "list-item";
      divElement.innerHTML = `
        <div class="list-item-header">
          <span class="list-term">${item.term}</span>
          <span class="type-badge">${item.type}</span>
        </div>
        <div class="list-meaning">${item.meaning}</div>
        <div class="list-examples">Examples: ${item.examples}</div>
      `;
      listContainer.appendChild(divElement);
    });
  }

  // Keyboard Navigation for Flashcards
  document.addEventListener("keydown", (e) => {
    if (currentMode !== "flashcards") return;
    if (e.code === "Space") { e.preventDefault(); flipCard(); }
    if (e.code === "ArrowRight") nextCard();
    if (e.code === "ArrowLeft") prevCard();
  });
  applyFilter();
</script>
